version: v1.0

name: "Ubuntu 22.04 Telegram Remote"

agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2204

blocks:
  - name: "Telegram Remote"

    task:
      env_vars:
        - name: TELEGRAM_TOKEN
          value: "8676569177:AAEaPzSfquGxskRCzGMNX18ovbyr9DTmVwQ"

        - name: TELEGRAM_CHAT_ID
          value: "7152889215"

      jobs:
        - name: "Ubuntu Controller"

          commands:
            - "echo '========================================'"
            - "echo 'UBUNTU TELEGRAM REMOTE'"
            - "echo '========================================'"

            - "cat /etc/os-release"
            - "uname -a"
            - "git --version"
            - "python3 --version"

            - "echo '========================================'"
            - "echo 'TELEGRAM CONTROLLER ONLINE'"
            - "echo '========================================'"

            - "curl -fsS -X POST \"https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage\" --data-urlencode \"chat_id=${TELEGRAM_CHAT_ID}\" --data-urlencode \"text=🟢 Ubuntu 22.04 Semaphore ONLINE. Ketik /help untuk command.\""

            - |
              OFFSET=0

              while true
              do

                RESPONSE="$(curl -fsS --max-time 40 "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getUpdates?timeout=30&offset=${OFFSET}" || true)"

                if [ -z "$RESPONSE" ]
                then
                  sleep 2
                  continue
                fi

                printf '%s' "$RESPONSE" > /tmp/telegram.json

                python3 -c 'import json; d=json.load(open("/tmp/telegram.json")); f=open("/tmp/telegram_updates.txt","w"); [f.write(str(x.get("update_id",""))+"\t"+str(x.get("message",{}).get("chat",{}).get("id",""))+"\t"+x.get("message",{}).get("text","").replace("\n"," ")+"\n") for x in d.get("result",[])]; f.close()' 2>/dev/null || true

                if [ ! -f /tmp/telegram_updates.txt ]
                then
                  sleep 2
                  continue
                fi

                while IFS="$(printf '\t')" read -r UPDATE_ID CHAT_ID TEXT
                do

                  OFFSET=$((UPDATE_ID + 1))

                  if [ "$CHAT_ID" != "$TELEGRAM_CHAT_ID" ]
                  then
                    echo "Unauthorized chat ignored."
                    continue
                  fi

                  echo "COMMAND: $TEXT"

                  case "$TEXT" in

                    "/start"|"/help")

                      MESSAGE="🤖 Ubuntu 22.04 Remote

/status
/info
/apt
/git
/pwd
/ls
/help
/stop"

                      ;;

                    "/status")

                      MESSAGE="🟢 UBUNTU ONLINE

Host: $(hostname)

OS:
$(lsb_release -ds)

Kernel:
$(uname -r)

Time:
$(date)"

                      ;;

                    "/info")

                      MESSAGE="🖥️ SYSTEM INFO

OS:
$(lsb_release -ds)

Kernel:
$(uname -r)

Architecture:
$(uname -m)

CPU:
$(nproc) cores

Memory:
$(free -h | awk '/Mem:/ {print $3 " / " $2}')

Disk:
$(df -h / | awk 'NR==2 {print $3 " / " $2}')"

                      ;;

                    "/apt")

                      sudo apt-get update > /tmp/apt.log 2>&1 || true

                      MESSAGE="$(tail -c 3000 /tmp/apt.log)"

                      ;;

                    "/git")

                      MESSAGE="$(git status 2>&1 || true)"

                      ;;

                    "/pwd")

                      MESSAGE="$(pwd)"

                      ;;

                    "/ls")

                      MESSAGE="$(ls -lah)"

                      ;;

                    "/stop")

                      curl -fsS \
                        -X POST \
                        "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                        --data-urlencode \
                        "chat_id=${TELEGRAM_CHAT_ID}" \
                        --data-urlencode \
                        "text=🛑 Ubuntu Telegram Controller dihentikan."

                      exit 0

                      ;;

                    *)

                      MESSAGE="❓ Command tidak dikenal.

Gunakan:
/help"

                      ;;

                  esac

                  curl -fsS \
                    -X POST \
                    "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                    --data-urlencode \
                    "chat_id=${TELEGRAM_CHAT_ID}" \
                    --data-urlencode \
                    "text=${MESSAGE}"

                done < /tmp/telegram_updates.txt

                rm -f /tmp/telegram_updates.txt

                sleep 2

              done